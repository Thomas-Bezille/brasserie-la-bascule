<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="La Bascule">
  <!--
    Icône PROVISOIRE, posée le 31/08/2026, à remplacer par le dessin de Sophie.

    Motif : rien n'existait, et le navigateur réclamait /favicon.ico sur chaque
    page, ce qui laissait un onglet vide et une erreur dans la console pendant
    la revue de la préproduction.

    Deux partis pris, à lui expliquer plutôt qu'à lui faire découvrir :
    - une bascule dessinée, pas une initiale : à 16 px une lettre dépend des
      polices du poste qui l'affiche, un trait non ;
    - le lettrage manuscrit du logo ne se réduit pas à cette taille. Un favicon
      est un dessin à part entière, c'est une demande de travail et non la
      livraison d'un fichier existant.
  -->
  <rect width="32" height="32" fill="#14110F"/>
  <g fill="#F3EDE3">
    <rect x="4.5" y="11.6" width="23" height="3.1" rx="0.4" transform="rotate(-11 16 13.15)"/>
    <path d="M16 14.2 L21.6 25.4 H10.4 Z"/>
  </g>
</svg>
