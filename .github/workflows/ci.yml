name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Installation
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next 16 génère les types de routes et de layouts (LayoutProps, PageProps)
      # dans .next/types, qui n'est pas versionné. Sans cette étape, tsc échoue
      # en CI sur des types qui existent pourtant en local après un premier build.
      - name: Génération des types de routes
        run: npx next typegen

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://exemple.fr

  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - name: Audit des dépendances
        run: npm audit --audit-level=high
